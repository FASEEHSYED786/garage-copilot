[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "garage-copilot"
version = "0.1.0"
description = "An AI copilot for garages and fleet operators: vehicle lookup, RAG over workshop knowledge, MOT risk prediction and a tool-using agent."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Syed Faseeh Ul Hassan" }]
requires-python = ">=3.11"
keywords = ["rag", "llm", "agents", "automotive", "fastapi", "scikit-learn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
garage-copilot = "garage_copilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garage_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]
